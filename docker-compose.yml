services:
  db:
    image: postgis/postgis:15-3.3
    container_name: fleetopsx-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleetuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetpass}
      POSTGRES_DB: ${POSTGRES_DB:-fleetopsx}
    ports:
      - "5600:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fleetuser -d fleetopsx" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleetopsx-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fleetopsx-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-fleetuser}:${POSTGRES_PASSWORD:-fleetpass}@db:5432/${POSTGRES_DB:-fleetopsx}
      REDIS_URL: redis://redis:6379/0
      # Force watchfiles to use polling so uvicorn --reload works
      # when source files are on a macOS host mounted into a Linux container
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  ui:
    build:
      context: ../FleetOpsX-UI
      dockerfile: Dockerfile
      target: dev
    container_name: fleetopsx-ui
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ../FleetOpsX-UI:/app
      - /app/node_modules

  prometheus:
    image: prom/prometheus:latest
    container_name: fleetopsx-prometheus
    volumes:
      - ./infra/prometheus:/etc/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: fleetopsx-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data:
